name: vytrafit
description: "VYTRAFIT: rutinas, seguimiento y pagos para entrenadores y sus asesorados."
publish_to: 'none'
version: 1.1.0+100

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  http: ^1.6.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  fl_chart: ^1.3.0
  cached_network_image: ^4.0.5
  image_picker: ^1.2.4
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  connectivity_plus: ^7.3.2
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  wakelock_plus: ^1.8.2
  flutter_svg: ^2.3.0
  package_info_plus: ^10.2.2
  path_drawing: ^1.0.1
  collection: ^1.19.1

  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/ejercicios/
    - assets/brand/
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-400.ttf
          weight: 400
        - asset: assets/fonts/Sora-500.ttf
          weight: 500
        - asset: assets/fonts/Sora-600.ttf
          weight: 600
        - asset: assets/fonts/Sora-700.ttf
          weight: 700
        - asset: assets/fonts/Sora-800.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/brand/icon-1024.png"
  adaptive_icon_background: "#0A5BFF"
  adaptive_icon_foreground: "assets/brand/icon-foreground.png"
  web:
    generate: true
    image_path: "assets/brand/icon-1024.png"
    background_color: "#060B1F"
    theme_color: "#0A5BFF"
