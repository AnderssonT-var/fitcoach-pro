# Compila la app Android (APK) y la publica en "Releases" del repositorio.
# Se ejecuta al subir una etiqueta v* (por ejemplo v1.0.0), con un commit a main que diga [apk]
# en el mensaje, o a mano desde la pestaña Actions.
name: App Android

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      api_url:
        description: "Dirección del servidor (https://...). Vacío = se pregunta en la app la primera vez"
        required: false

permissions:
  contents: write

jobs:
  apk:
    if: github.event_name != 'push' || github.ref_type == 'tag' || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ inputs.api_url || vars.API_URL }}
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('1.0.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la app web
        run: npm run build

      - name: Copiar la app web a Android
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar firma (si existen los secretos)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "FCP_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Firmando con la clave de producción"
          else
            echo "::warning::Sin secretos de firma: el APK se firma con la clave de depuración."
          fi

      - name: Compilar APK
        working-directory: android
        env:
          FCP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FCP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FCP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FCP_VERSION_CODE: ${{ github.run_number }}
          FCP_VERSION_NAME: ${{ env.VERSION }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            # Muestra el error como anotación (visible en el resumen del workflow)
            { grep -A6 "What went wrong" build.log; grep -E "Caused by|build.gradle'? line|\.gradle:[0-9]+" build.log | head -15; grep -E "^e: |error:" build.log | head -10; } | head -45 | while IFS= read -r l; do echo "::error::$l"; done
            tail -30 build.log
            exit $status
          fi
          set -e
          if [ -n "$FCP_KEYSTORE_FILE" ]; then ./gradlew bundleRelease --no-daemon; fi

      - name: Nombrar archivos
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk "out/FitCoachPro-${VERSION}.apk"
          if ls android/app/build/outputs/bundle/release/*.aab >/dev/null 2>&1; then cp android/app/build/outputs/bundle/release/*.aab "out/FitCoachPro-${VERSION}.aab"; fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: FitCoachPro-${{ env.VERSION }}
          path: out/*

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('android-{0}', github.run_number) }}
          name: FitCoach Pro ${{ env.VERSION }} (Android)
          body: |
            App Android de FitCoach Pro.
            Descarga **FitCoachPro-${{ env.VERSION }}.apk** en el teléfono y ábrelo para instalar (Android pedirá permitir "instalar apps desconocidas").
          files: out/*
