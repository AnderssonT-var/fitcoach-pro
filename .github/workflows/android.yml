# Compila la app Android nativa (Flutter, carpeta mobile/) y la publica en "Releases".
# Se ejecuta al subir una etiqueta v*, con un commit a main que diga [apk] en el mensaje,
# o a mano desde la pestaña Actions.
name: App Android

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      api_url:
        description: "Dirección del servidor (https://...)"
        required: false

permissions:
  contents: write

jobs:
  apk:
    if: github.event_name != 'push' || github.ref_type == 'tag' || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_URL: ${{ inputs.api_url || vars.API_URL || 'https://vytra.fit' }}
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('2.0.{0}', github.run_number) }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Paquetes y revisión del código
        run: |
          flutter config --no-analytics
          flutter --version | head -1 | sed 's/^/::notice::/'
          flutter pub get 2>&1 | tail -20 | sed 's/^/::notice::/'
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          grep -E "error|warning" analyze.txt | head -30 | sed 's/^/::warning::/' || true
          if grep -q " error " analyze.txt; then echo "::error::El código tiene errores"; exit 1; fi

      - name: Firma (clave de producción si existe; si no, una clave fija guardada en caché)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "FCP_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Firmando con la clave de producción"
          else
            echo "::warning::Sin secretos de firma (ANDROID_KEYSTORE_BASE64…): se usa una clave de depuración. Para actualizar sin desinstalar entre versiones, agrega los secretos."
          fi

      - name: Clave de depuración estable
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vytrafit-debug-keystore-v1

      - name: Notificaciones (Firebase, si existe el secreto GOOGLE_SERVICES_JSON)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Si no está como secreto, se usa el archivo del repositorio (sus datos van dentro de la app de todas formas)
          if [ -z "$GOOGLE_SERVICES_JSON" ] && [ -f android/app/google-services.json ]; then GOOGLE_SERVICES_JSON=$(cat android/app/google-services.json); fi
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::Sin GOOGLE_SERVICES_JSON: la app se compila sin notificaciones del servidor."
            echo "FCM_DEFINES=" >> "$GITHUB_ENV"; exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/gs.json"
          PKG=com.atdev.fitcoachpro
          PROJECT=$(jq -r '.project_info.project_id' "$RUNNER_TEMP/gs.json")
          SENDER=$(jq -r '.project_info.project_number' "$RUNNER_TEMP/gs.json")
          APPID=$(jq -r --arg p "$PKG" '.client[] | select(.client_info.android_client_info.package_name==$p) | .client_info.mobilesdk_app_id' "$RUNNER_TEMP/gs.json" | head -1)
          KEY=$(jq -r --arg p "$PKG" '.client[] | select(.client_info.android_client_info.package_name==$p) | .api_key[0].current_key' "$RUNNER_TEMP/gs.json" | head -1)
          if [ -z "$APPID" ] || [ -z "$KEY" ] || [ "$APPID" = "null" ]; then echo "::error::google-services.json no tiene la app $PKG"; exit 1; fi
          echo "::add-mask::$KEY"
          echo "FCM_DEFINES=--dart-define=FCM_API_KEY=$KEY --dart-define=FCM_APP_ID=$APPID --dart-define=FCM_SENDER_ID=$SENDER --dart-define=FCM_PROJECT_ID=$PROJECT" >> "$GITHUB_ENV"
          echo "::notice::Notificaciones activadas (proyecto $PROJECT)"

      - name: Compilar APK
        env:
          FCP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FCP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FCP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))
          if ! flutter build apk --release --build-name="${VERSION#v}" --build-number="$BUILD_NUMBER" --dart-define=API_URL="$API_URL" $FCM_DEFINES > build.log 2>&1; then
            { grep -A8 "What went wrong" build.log; grep -E "^e: |error:|Error:|FAILURE|Exception" build.log | head -25; } | head -50 | while IFS= read -r l; do echo "::error::$l"; done
            tail -40 build.log | while IFS= read -r l; do echo "::warning::$l"; done
            exit 1
          fi
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-release.apk "../out/VYTRAFIT-${VERSION}.apk"
          ls -la ../out

      - name: Versión web de prueba (para revisar pantallas)
        run: |
          flutter build web --release --no-web-resources-cdn --dart-define=API_URL="$API_URL"
          cd build && zip -qr ../../out/web-preview.zip web

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('android-{0}', github.run_number) }}
          name: VYTRAFIT ${{ env.VERSION }} (Android)
          body: |
            App Android nativa de VYTRAFIT (Flutter).
            Descarga **VYTRAFIT-${{ env.VERSION }}.apk** en el teléfono y ábrelo para instalar (Android pedirá permitir "instalar apps desconocidas").
          files: out/VYTRAFIT-*.apk
