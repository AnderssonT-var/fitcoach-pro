# Compila la app Android nativa (Flutter, carpeta mobile/) y la publica en "Releases".
# Se ejecuta al subir una etiqueta v*, con un commit a main que diga [apk] en el mensaje,
# o a mano desde la pestaña Actions.
name: App Android

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      api_url:
        description: "Dirección del servidor (https://...)"
        required: false

permissions:
  contents: write

jobs:
  apk:
    if: github.event_name != 'push' || github.ref_type == 'tag' || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_URL: ${{ inputs.api_url || vars.API_URL || 'https://vytra.fit' }}
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('2.0.{0}', github.run_number) }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Paquetes y revisión del código
        run: |
          flutter config --no-analytics
          flutter --version | head -1 | sed 's/^/::notice::/'
          flutter pub get 2>&1 | tail -20 | sed 's/^/::notice::/'
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          grep -E "error|warning" analyze.txt | head -30 | sed 's/^/::warning::/' || true
          if grep -q " error " analyze.txt; then echo "::error::El código tiene errores"; exit 1; fi

      - name: Firma (clave de producción si existe; si no, una clave fija guardada en caché)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "FCP_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Firmando con la clave de producción"
          else
            echo "::warning::Sin secretos de firma (ANDROID_KEYSTORE_BASE64…): se usa una clave de depuración. Para actualizar sin desinstalar entre versiones, agrega los secretos."
          fi

      - name: Clave de depuración estable
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vytrafit-debug-keystore-v1

      - name: Compilar APK
        env:
          FCP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FCP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FCP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))
          flutter build apk --release --build-name="${VERSION#v}" --build-number="$BUILD_NUMBER" --dart-define=API_URL="$API_URL"
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-release.apk "../out/VYTRAFIT-${VERSION}.apk"
          ls -la ../out

      - name: Versión web de prueba (para revisar pantallas)
        run: |
          flutter build web --release --no-web-resources-cdn --dart-define=API_URL="$API_URL"
          cd build && zip -qr ../../out/web-preview.zip web

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('android-{0}', github.run_number) }}
          name: VYTRAFIT ${{ env.VERSION }} (Android)
          body: |
            App Android nativa de VYTRAFIT (Flutter).
            Descarga **VYTRAFIT-${{ env.VERSION }}.apk** en el teléfono y ábrelo para instalar (Android pedirá permitir "instalar apps desconocidas").
          files: out/VYTRAFIT-*.apk
